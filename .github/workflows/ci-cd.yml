name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Image lives at ghcr.io/<owner>/trucker
  DJANGO_ENV: prod
  DATABASE_URL: sqlite:///db.sqlite3

jobs:
  backend-checks:
    name: Backend Lint + Django Check
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: dev
      SECRET_KEY: ci-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,migrations,__pycache__
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,venv,migrations,__pycache__

      - name: Django system check
        working-directory: backend
        run: python manage.py check

  frontend-checks:
    name: Frontend Install + Lint Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint (non-blocking)
        continue-on-error: true
        working-directory: frontend
        run: npm run lint

  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            image: trucker-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: ""
          - service: frontend
            image: trucker-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: VITE_API_BASE_URL=http://backend:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repo owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        if: matrix.service == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/${{ matrix.image }}:latest
            ghcr.io/${{ env.REPO_OWNER }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runner
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/${{ matrix.image }}:latest
            ghcr.io/${{ env.REPO_OWNER }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. SSH into VPS and redeploy ──────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.VPS_USER }}/trucker"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
          DJANGO_ENV: ${{ secrets.DJANGO_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ALLOWED_HOSTS,CSRF_TRUSTED_ORIGINS,DJANGO_ENV
          script: |
            set -e
            APP_DIR="/home/${{ secrets.VPS_USER }}/trucker"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "DJANGO_ENV=$DJANGO_ENV" >> .env
            echo "DEBUG=False" >> .env
            echo "ALLOWED_HOSTS=$ALLOWED_HOSTS" >> .env
            echo "CSRF_TRUSTED_ORIGINS=$CSRF_TRUSTED_ORIGINS" >> .env

            # Authenticate with GHCR using a read-only PAT
            echo "${{ secrets.GHP_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull the new image and recreate changed containers
            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            sleep 10
            # Retry migrate until DB is reachable (handles DNS settling after container recreate)
            for i in 1 2 3 4 5 6; do
              docker compose -f docker-compose.prod.yml exec -T web python manage.py migrate && break
              echo "Migrate attempt $i failed — retrying in 10s..."
              sleep 10
            done
            docker compose -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput

            echo "Deploy complete — $(date)"