services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/ndolo7/trucker-backend:latest
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --access-logfile - --access-logformat '"%(r)s" %(s)s %(B)s' --error-logfile - --capture-output --log-level info
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_ENV: prod
      DATABASE_PATH: /app/data/db.sqlite3
    ports:
      - "8005:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/ndolo7/trucker-frontend:latest
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  static_volume:
  media_volume:
  backend_data:
